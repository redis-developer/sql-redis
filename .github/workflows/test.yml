name: Test Suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  UV_VERSION: "0.7.13"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv sync

      - name: Run tests
        run: |
          make test


  redis-py-compat:
    name: redis-py ${{ matrix.redis-py }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis-py: ["6.3.0", "7.4.0", "8.1.0"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"   # sets UV_PYTHON
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv sync

      # Without this, a resolution surprise leaves the job exercising the
      # locked redis-py while still reporting green, and the axis rots.
      - name: Confirm the redis-py overlay took effect
        run: >
          uv run --with 'redis==${{ matrix.redis-py }}'
          python -c "import redis, sys;
          print('redis-py', redis.__version__);
          sys.exit(0 if redis.__version__ == '${{ matrix.redis-py }}' else 1)"

      # Reply shapes depend on the redis-py version and the negotiated RESP
      # protocol, so the protocol-marked tests run against each supported
      # redis-py. Selecting by marker rather than by filename means a new
      # protocol-sensitive test is picked up here without editing this job.
      # 'uv run --with' layers an ephemeral overlay and never writes uv.lock.
      - name: Run reply-shape and protocol tests
        run: >
          uv run --with 'redis==${{ matrix.redis-py }}'
          python -m pytest -m protocol -q
